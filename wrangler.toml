name = "hindsight-backend"
main = "src/index.ts"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

# Durable Object binding
# The "name" must match the string passed to getWsServerDurableObjectFetch()
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RetroRoomDO"

# SQLite storage migration (required for createDurableObjectSqlStoragePersister)
# See: https://tinybase.org/api/persister-durable-object-sql-storage/
# Non-secret environment variables
[vars]
LOGS_API_URL = "https://hindsight-dash.jcp6.workers.dev/"

# Declare required secrets for deploy validation and .dev.vars filtering
# Set actual values via: wrangler secret put BASIC_AUTH_USER / BASIC_AUTH_PASS
[secrets]
required = ["BASIC_AUTH_USER", "BASIC_AUTH_PASS"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RetroRoomDO"]
